name: Eski EXE kopyalarini sil
on:
  push:
    branches: [claude/laughing-keller-cofmc6]
permissions:
  actions: write
jobs:
  sil:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          n=0
          for id in $ids; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && n=$((n+1)); done
          echo "Silinen: $n"
